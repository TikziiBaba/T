<!doctype html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Tuğçe'm</title>
	<style>
		:root{--bg:#1b0a12;--accent:#ff6b8a}
		*{box-sizing:border-box}
		html,body{height:100%;margin:0}
		body{background:var(--bg);display:grid;place-items:center;font-family:system-ui,Segoe UI,Roboto,Arial;color:white}
		.stage{width:min(720px,90vw);height:min(720px,90vw);display:grid;place-items:center;position:relative}
		svg{width:100%;height:100%;overflow:visible}
		.shape{position:absolute;left:0;top:0;width:100%;height:100%;display:grid;place-items:center;transition:opacity .6s ease,transform .6s ease;opacity:0;transform:scale(.95)}
		.shape.show{opacity:1;transform:scale(1)}
		.center{width:55%;height:55%;display:block}
		/* Center the final text both horizontally and vertically, responsive */
		.text{position:absolute;top:50%;left:50%;width:90%;max-width:720px;transform:translate(-50%,-50%) scale(.98);text-align:center;font-size:clamp(1.6rem,7vw,3.6rem);line-height:1.05;letter-spacing:0.02em;opacity:0;transition:opacity .6s ease,transform .6s ease,color .4s ease;text-shadow:0 6px 22px rgba(0,0,0,0.45);color:#ffdbe6;padding:0 8px}
		.text.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
		/* Styled replay button for mobile friendliness */
		.replay{position:absolute;right:12px;bottom:12px;background:linear-gradient(135deg,#ff6b8a,#ff9bb3);border:0;color:white;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:14px;box-shadow:0 8px 24px rgba(255,107,138,0.18);backdrop-filter:blur(6px)}
		.replay:active{transform:translateY(1px)}
		.replay:hover{box-shadow:0 12px 30px rgba(255,107,138,0.24)}
		@media(max-width:420px){
			.replay{right:10px;bottom:10px;padding:10px 12px;border-radius:10px;font-size:13px}
			.text{font-size:clamp(1.4rem,9vw,2.6rem)}
		}
		/* subtle float */
		@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
		.float{animation:floaty 3.6s ease-in-out infinite}
	</style>
</head>
<body>
	<div class="stage" id="stage" aria-hidden="false">
		<!-- Heart -->
		<div class="shape show" id="heart">
			<svg viewBox="0 0 100 100" class="center float">
				<path d="M50 84s-26-15-34-24C6 45 18 24 35 30c6 2 11 7 15 12 4-5 9-10 15-12 17-6 29 15 19 30-8 9-34 24-34 24z" fill="url(#g)" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
				<defs>
					<linearGradient id="g" x1="0" x2="1">
						<stop offset="0" stop-color="#ff6b8a"/>
						<stop offset="1" stop-color="#ff9bb3"/>
					</linearGradient>
				</defs>
			</svg>
		</div>

		<!-- Flower (rose-like) -->
		<div class="shape" id="flower">
			<svg viewBox="0 0 100 100" class="center float">
				<g fill="#ff9bb3" stroke="#ff6b8a" stroke-width="0.6">
					<circle cx="50" cy="46" r="8" fill="#ff6b8a"/>
					<circle cx="50" cy="34" r="6"/>
					<circle cx="42" cy="40" r="5"/>
					<circle cx="58" cy="40" r="5"/>
					<rect x="47" y="52" width="6" height="18" rx="3" fill="#7a2e3b"/>
				</g>
			</svg>
		</div>

		<!-- Envelope with heart -->
		<div class="shape" id="envelope">
			<svg viewBox="0 0 100 100" class="center float">
				<rect x="12" y="30" width="76" height="40" rx="6" fill="#ffdbe6" stroke="#ff6b8a" stroke-width="1.2"/>
				<path d="M12 30 L50 56 L88 30" fill="none" stroke="#ff6b8a" stroke-width="1.6"/>
				<g transform="translate(40,36)">
					<path d="M10 8c0-2.8 2.2-5 5-5s5 2.2 5 5c0 4-5 7-5 7s-5-3-5-7z" fill="#ff6b8a"/>
				</g>
			</svg>
		</div>

		<!-- Sparkles -->
		<div class="shape" id="sparkle">
			<svg viewBox="0 0 100 100" class="center float">
				<g fill="#fff0f6" stroke="#ffd0e0" stroke-width="0.4">
					<polygon points="50,12 53,28 69,31 55,40 59,56 50,46 41,56 45,40 31,31 47,28"/>
					<circle cx="22" cy="22" r="3"/>
					<circle cx="78" cy="28" r="2.5"/>
					<circle cx="72" cy="72" r="2.8"/>
				</g>
			</svg>
		</div>

		<div class="text" id="finalText">Seni çok seviyorum</div>
		<button class="replay" id="replayBtn" aria-label="Yeniden oynat">Yeniden</button>
	</div>

	<script>
		(function(){
			const seq = ['heart','flower','envelope','sparkle'];
			const showTime = 1400;
			let idx = 0;
			const text = document.getElementById('finalText');
			const replay = document.getElementById('replayBtn');

			function setVisible(id){
				document.querySelectorAll('.shape').forEach(el=>el.classList.remove('show'));
				const el = document.getElementById(id);
				if(el) el.classList.add('show');
			}

			function play(){
				idx = 0;
				text.classList.remove('show');
				setVisible(seq[0]);
				for(let i=1;i<seq.length;i++){
					setTimeout(((i)=>{
						return ()=>setVisible(seq[i]);
					})(i), i*showTime);
				}
				// show text after sequence
				setTimeout(()=>{
					document.querySelectorAll('.shape').forEach(el=>el.classList.remove('show'));
					text.classList.add('show');
				}, seq.length*showTime);
			}

			// autoplay on load
			window.addEventListener('load', ()=>{ setTimeout(play, 300); });
			// replay button
			replay.addEventListener('click', ()=>{ play(); });
			// also allow clicking stage to replay
			document.getElementById('stage').addEventListener('click', (e)=>{ if(e.target.id!=='replayBtn') play(); });
		})();
	</script>
</body>
</html>
