<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Orbitron:wght@500&family=Poppins:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bg: #fff0f3;
            --pink-accent: #ff4d6d;
            --pink-dark: #c9184a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.1);
        }

        /* Saat Stili */
        #clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem;
            color: var(--pink-accent);
            text-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            transition: all 1s ease;
        }

        /* Mesaj Stili */
        #message {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .love-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            color: var(--pink-dark);
            line-height: 1.2;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* Aktifleştiğinde */
        .celebrate #clock {
            display: none;
        }

        .celebrate #message {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* Küçük ipucu (Sadece senin bilmen için çok silik) */
        .hint {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(0,0,0,0.05);
            user-select: none;
        }
    </style>
</head>
<body id="body">

    <div class="container" id="mainContainer">
        <div id="clock">00:00:00</div>

        <div id="message">
            <div class="love-text">
                İyi ki doğdun bitanem!<br>
                Seni çok seviyorum ❤️
            </div>
        </div>
    </div>

    <div class="hint">alo</div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // 1. Canlı Saat Fonksiyonu
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Gizli Tuş Takibi ("alo")
        let buffer = "";
        window.addEventListener('keydown', (e) => {
            buffer += e.key.toLowerCase();
            
            // Sadece son 3 harfi tut
            if (buffer.length > 3) {
                buffer = buffer.substring(buffer.length - 3);
            }

            // Eğer "alo" yazıldıysa kutlamayı başlat
            if (buffer === "alo") {
                startCelebration();
                buffer = ""; // Buffer'ı temizle
            }
        });

        // 3. Kutlama Fonksiyonu
        function startCelebration() {
            const container = document.getElementById('mainContainer');
            container.parentElement.classList.add('celebrate');
            
            // Konfetileri patlat
            launchConfetti();
        }

        function launchConfetti() {
            var duration = 15 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0a54', '#ff477e', '#ff7096']
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0a54', '#ff477e', '#ff7096']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
